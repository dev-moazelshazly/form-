<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>form</title>
        <link rel="stylesheet" href="index.css" />
</head>

<body>
<div class="all">
    <div class="form">
        <form action="" method="post">
            <div class="username,password,email">
                <input type="username" required placeholder="username" name="username" autofocus/>
                <br />
                <input type="password" required placeholder="password" name="password" maxlength="20" min="5" />
                <br />
                <input type="email" required placeholder="email" name="email" />
                <br />
                <br />
            </div>
            <div class="button">
                <input type="submit" placeholder="submit" name="submit" />
                <br />
                <input type="reset" placeholder="reset" name="reset" />
                <br />
            </div>
        </form>
    </div>
<br>
<br>

</div>
</body>

</html>
